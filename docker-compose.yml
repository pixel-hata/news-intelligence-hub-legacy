services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_hub}
      POSTGRES_USER: ${POSTGRES_USER:-news_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_hub_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news_hub} -d ${POSTGRES_DB:-news_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run db:push
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://news_hub:news_hub_password@postgres:5432/news_hub}
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run db:seed
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://news_hub:news_hub_password@postgres:5432/news_hub}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w @nih/api
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://news_hub:news_hub_password@postgres:5432/news_hub}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w @nih/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://news_hub:news_hub_password@postgres:5432/news_hub}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -w @nih/web -- --host 0.0.0.0
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
      VITE_SHOW_QUEUE_LINK: ${VITE_SHOW_QUEUE_LINK:-true}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
